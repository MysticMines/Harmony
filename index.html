<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>iShadow 爱影</title>
    <style>
        /* 全局基础重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --bg-color: #fdfbf7;
            --text-color: #333333;
            --glass-bg: rgba(255, 255, 255, 0.4);
            --glass-border: rgba(255, 255, 255, 0.6);
            --glass-shadow: 0 8px 32px 0 rgba(220, 180, 50, 0.15);
            --accent-color: #e6a800;
            --menu-bg: rgba(255, 255, 255, 0.85);
            --menu-line: rgba(0, 0, 0, 0.1);
        }

        [data-theme="dark"] {
            --bg-color: #0d0d0d;
            --text-color: #f0f0f0;
            --glass-bg: rgba(20, 20, 20, 0.5);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-shadow: 0 8px 32px 0 rgba(255, 100, 0, 0.15);
            --accent-color: #ff6a00;
            --menu-bg: rgba(30, 30, 30, 0.85);
            --menu-line: rgba(255, 255, 255, 0.1);
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            transition: background-color 0.3s, color 0.3s;
            min-height: 100vh;
            overflow-x: hidden;
            background-image: radial-gradient(circle at 10% 10%, var(--glass-shadow) 0%, transparent 40%),
                              radial-gradient(circle at 90% 90%, var(--glass-shadow) 0%, transparent 40%);
            background-attachment: fixed;
        }

        /* ---------------- 顶部导航栏 ---------------- */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 100;
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
        }

        .left-controls {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .theme-toggle {
            cursor: pointer;
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-color);
            transition: transform 0.3s;
        }
        .theme-toggle:hover { transform: rotate(15deg); }

        .logo {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 0.5px;
            background: linear-gradient(45deg, var(--accent-color), #ffaa00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            cursor: pointer;
        }

        .right-controls {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        /* 搜索框 */
        .search-container {
            display: flex;
            align-items: center;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 5px 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        .search-container select {
            background: transparent;
            border: none;
            color: var(--text-color);
            outline: none;
            font-size: 14px;
            padding-right: 8px;
            border-right: 1px solid var(--menu-line);
            cursor: pointer;
        }

        .search-container select option { background: var(--bg-color); color: var(--text-color); }

        .search-btn {
            background: transparent; border: none; color: var(--text-color);
            padding: 2px 5px 2px 10px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }

        /* 头像与菜单 */
        .avatar-container { position: relative; }

        .avatar {
            width: 40px; height: 40px; border-radius: 50%;
            background: var(--glass-bg); border: 2px solid var(--glass-border);
            cursor: pointer; object-fit: cover;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .avatar svg { width: 24px; height: 24px; fill: var(--text-color); opacity: 0.7; }

        .dropdown-menu {
            position: absolute; top: 50px; right: 0; width: 220px;
            background: var(--menu-bg); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            border-radius: 16px; border: 1px solid var(--glass-border);
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
            display: none; flex-direction: column; overflow: hidden;
            animation: fadeInDown 0.2s ease-out; transform-origin: top right;
        }
        
        .dropdown-menu.active { display: flex; }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-10px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .menu-item {
            padding: 15px 20px; font-size: 15px; cursor: pointer;
            border-bottom: 1px solid var(--menu-line);
            display: flex; justify-content: space-between; align-items: center;
            transition: background 0.2s;
        }
        .menu-item:last-child { border-bottom: none; }
        .menu-item:hover { background: rgba(128, 128, 128, 0.1); }

        /* 主页瀑布流 */
        main { padding: 100px 20px 40px; max-width: 1400px; margin: 0 auto; }

        .waterfall { column-count: 4; column-gap: 20px; }
        @media (max-width: 1200px) { .waterfall { column-count: 3; } }
        @media (max-width: 800px) { .waterfall { column-count: 2; } }
        @media (max-width: 500px) { .waterfall { column-count: 2; column-gap: 12px; } main { padding-top: 85px; } }

        .card {
            break-inside: avoid; margin-bottom: 20px; border-radius: 16px;
            overflow: hidden; position: relative; cursor: pointer;
            background: var(--glass-bg); border: 1px solid var(--glass-border);
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .card:hover { transform: translateY(-5px); box-shadow: 0 10px 25px var(--glass-shadow); }

        .card img { width: 100%; display: block; object-fit: cover; }

        .card-overlay {
            position: absolute; bottom: 0; left: 0; width: 100%;
            padding: 20px 15px 15px; background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
            color: #fff; font-size: 14px; opacity: 0; transition: opacity 0.3s;
            display: flex; justify-content: space-between; align-items: center;
        }

        .card:hover .card-overlay { opacity: 1; }
        .card-overlay .download-icon { width: 24px; height: 24px; fill: #fff; }

        /* 弹窗与表单 */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.4); backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px);
            display: none; align-items: center; justify-content: center; z-index: 200;
        }

        .modal {
            background: var(--menu-bg); padding: 30px; border-radius: 24px; width: 90%; max-width: 400px;
            border: 1px solid var(--glass-border); box-shadow: 0 20px 40px rgba(0,0,0,0.2); text-align: center;
        }

        .modal h2 { margin-bottom: 15px; font-size: 22px; }
        .modal p { margin-bottom: 20px; font-size: 15px; line-height: 1.5; opacity: 0.8; }

        .input-group { margin-bottom: 15px; text-align: left; }

        .input-group input {
            width: 100%; padding: 12px 15px; border-radius: 12px; border: 1px solid var(--glass-border);
            background: rgba(128,128,128,0.1); color: var(--text-color); font-size: 16px; outline: none; transition: border 0.3s;
        }

        .input-group input:focus { border-color: var(--accent-color); }

        .btn-primary {
            width: 100%; padding: 12px; border-radius: 12px; border: none;
            background: var(--accent-color); color: #fff; font-size: 16px; font-weight: 600;
            cursor: pointer; margin-top: 10px; transition: opacity 0.3s;
        }
        .btn-primary:hover { opacity: 0.9; }

        .toggle-text { margin-top: 15px; font-size: 14px; color: var(--text-color); opacity: 0.7; cursor: pointer; }
        .error-msg { color: #ff4d4f; font-size: 13px; margin-bottom: 10px; text-align: left; display: none; }

        /* 跳转我的仓库页面 */
        #warehouse-page { display: none; padding: 120px 20px 40px; max-width: 1400px; margin: 0 auto; text-align: center; }
        #warehouse-page h1 { margin-bottom: 20px; }
    </style>
</head>
<body>

    <!-- 顶部导航栏 -->
    <header>
        <div class="left-controls">
            <div class="theme-toggle" id="theme-toggle">
                <svg id="theme-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 28px; height: 28px;">
                    <circle cx="12" cy="12" r="5"></circle>
                    <line x1="12" y1="1" x2="12" y2="3"></line>
                    <line x1="12" y1="21" x2="12" y2="23"></line>
                    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                    <line x1="1" y1="12" x2="3" y2="12"></line>
                    <line x1="21" y1="12" x2="23" y2="12"></line>
                    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                </svg>
            </div>
            <div class="logo" id="logo-btn">iShadow 爱影</div>
        </div>

        <div class="right-controls">
            <!-- 搜索筛选框 -->
            <div class="search-container" id="search-container">
                <select id="search-filter">
                    <option value="all">全部风格</option>
                    <option value="qingcheng">青橙</option>
                    <option value="heijin">黑金</option>
                    <option value="fugu">复古</option>
                    <option value="danxing">单色</option>
                </select>
                <button class="search-btn" id="search-btn">
                    <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                </button>
            </div>

            <!-- 头像及菜单 -->
            <div class="avatar-container">
                <div class="avatar" id="avatar-btn">
                    <svg id="default-avatar-icon" viewBox="0 0 24 24">
                        <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                    </svg>
                    <img id="user-avatar-img" src="" style="display: none; width: 100%; height: 100%; border-radius: 50%; object-fit: cover;">
                </div>
                
                <!-- 下拉菜单 -->
                <div class="dropdown-menu" id="dropdown-menu">
                    <div class="menu-item" id="menu-my-avatar">我的头像</div>
                    <div class="menu-item" id="menu-my-name">我的名字</div>
                    <div class="menu-item" id="menu-warehouse">我的仓库</div>
                    <div class="menu-item" id="menu-language">
                        <span>语言设置</span>
                        <select id="lang-select" style="background: transparent; border: none; color: var(--text-color); outline: none; font-size: 14px;">
                            <option value="zh-CN">中文</option>
                            <option value="en-US">English</option>
                            <option value="ja-JP">日本語</option>
                            <option value="ko-KR">한국어</option>
                            <option value="zh-HK">繁中[中国香港]</option>
                        </select>
                    </div>
                    <div class="menu-item" id="menu-logout" style="color: #ff4d4f;">退出登录</div>
                </div>
            </div>
        </div>
    </header>

    <!-- 主页面瀑布流 -->
    <main id="main-page">
        <div class="waterfall" id="waterfall"></div>
    </main>

    <!-- 我的仓库页面 -->
    <div id="warehouse-page">
        <h1>我的仓库</h1>
        <p style="opacity: 0.7; margin-bottom: 30px;">这里是你下载过的 LUT 记录</p>
        <div class="waterfall" id="warehouse-waterfall"></div>
    </div>

    <!-- 登录/注册弹窗 -->
    <div class="modal-overlay" id="auth-modal">
        <div class="modal">
            <h2 id="auth-title">登录</h2>
            <div class="error-msg" id="auth-error"></div>
            <div class="input-group">
                <input type="text" id="auth-username" placeholder="例:iShadow" autocomplete="off">
            </div>
            <div class="input-group">
                <input type="password" id="auth-password" placeholder="输入密码" autocomplete="off">
            </div>
            <button class="btn-primary" id="auth-submit">登录</button>
            <div class="toggle-text" id="auth-toggle">没有账号？点击注册</div>
        </div>
    </div>

    <!-- 下载提示弹窗 -->
    <div class="modal-overlay" id="download-modal">
        <div class="modal">
            <h2>获取 LUT 提取码</h2>
            <p>请点击下方按钮前往蓝奏云，<br>提取码请在 <b>官方Q群</b> 内获取。</p>
            <button class="btn-primary" id="confirm-download-btn">前往下载</button>
            <div class="toggle-text" onclick="document.getElementById('download-modal').style.display='none'">取消</div>
        </div>
    </div>

    <!-- 隐藏的图片上传 input -->
    <input type="file" id="avatar-upload" accept="image/*" style="display: none;">

    <script>
        // ---------------- 状态管理 ----------------
        let isLoginMode = true; 
        let currentUser = JSON.parse(localStorage.getItem('ishadow_user')) || null;
        let currentTheme = localStorage.getItem('ishadow_theme') || 'light';
        let pendingDownloadUrl = ''; // 暂存当前点击的下载链接

        // 【真实数据】你的 LUT 列表
        const lutData = [
            {
                id: 'labradorite',
                title: 'Labradorite',
                category: '复古', // 对应搜索分类
                img: './labradorite.jpg', // 图片文件名
                downloadUrl: 'https://www.ilanzou.com/s/A3PyTHXAb' // 蓝奏云链接
            }
            // 以后有新图，就复制上面的大括号，加个逗号粘贴下来改内容
        ];

        // 初始化主题
        document.documentElement.setAttribute('data-theme', currentTheme);
        updateThemeIcon();

        // ---------------- 渲染瀑布流 (懒加载) ----------------
        const waterfall = document.getElementById('waterfall');
        
        function renderCards(data, container = waterfall) {
            container.innerHTML = '';
            if(data.length === 0) {
                container.innerHTML = '<p style="width:100%; column-span: all; opacity:0.5; text-align:center; padding: 50px 0;">没有找到相关的内容</p>';
                return;
            }

            data.forEach(lut => {
                const card = document.createElement('div');
                card.className = 'card';
                // 这里加入了 loading="lazy" 实现滚动到可视区域才加载图片
                card.innerHTML = `
                    <img src="${lut.img}" alt="${lut.title}" loading="lazy" onerror="this.src='https://placehold.co/400x400?text=请将图片放在同目录下'">
                    <div class="card-overlay">
                        <span>${lut.title}</span>
                        <svg class="download-icon" viewBox="0 0 24 24">
                            <path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/>
                        </svg>
                    </div>
                `;
                
                // 点击卡片触发拦截
                card.onclick = () => {
                    if(!currentUser) {
                        showAuthModal();
                        return;
                    }
                    
                    // 暂存链接并显示提示框
                    pendingDownloadUrl = lut.downloadUrl;
                    document.getElementById('download-modal').style.display = 'flex';

                    // 存入我的仓库
                    let warehouse = JSON.parse(localStorage.getItem(`ishadow_wh_${currentUser.username}`)) || [];
                    if(!warehouse.find(item => item.id === lut.id)) {
                        warehouse.push(lut);
                        localStorage.setItem(`ishadow_wh_${currentUser.username}`, JSON.stringify(warehouse));
                    }
                };
                container.appendChild(card);
            });
        }

        renderCards(lutData);

        // 确认前往下载
        document.getElementById('confirm-download-btn').onclick = () => {
            window.open(pendingDownloadUrl, '_blank');
            document.getElementById('download-modal').style.display = 'none';
        };

        // ---------------- 搜索功能 ----------------
        document.getElementById('search-btn').onclick = () => {
            const selectedCat = document.getElementById('search-filter').value;
            if(selectedCat === 'all') {
                renderCards(lutData);
            } else {
                const selectedText = document.querySelector(`#search-filter option[value="${selectedCat}"]`).text;
                const filtered = lutData.filter(l => l.category === selectedText);
                renderCards(filtered);
            }
            document.getElementById('main-page').style.display = 'block';
            document.getElementById('warehouse-page').style.display = 'none';
        };

        // 点击 Logo 回主页
        document.getElementById('logo-btn').onclick = () => {
            document.getElementById('main-page').style.display = 'block';
            document.getElementById('warehouse-page').style.display = 'none';
            renderCards(lutData);
        };

        // ---------------- 主题切换 ----------------
        const themeToggle = document.getElementById('theme-toggle');
        const themeIcon = document.getElementById('theme-icon');
        
        themeToggle.onclick = () => {
            currentTheme = currentTheme === 'light' ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', currentTheme);
            localStorage.setItem('ishadow_theme', currentTheme);
            updateThemeIcon();
        };

        function updateThemeIcon() {
            if (currentTheme === 'dark') {
                themeIcon.innerHTML = `<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>`;
            } else {
                themeIcon.innerHTML = `
                    <circle cx="12" cy="12" r="5"></circle>
                    <line x1="12" y1="1" x2="12" y2="3"></line>
                    <line x1="12" y1="21" x2="12" y2="23"></line>
                    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                    <line x1="1" y1="12" x2="3" y2="12"></line>
                    <line x1="21" y1="12" x2="23" y2="12"></line>
                    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                `;
            }
        }

        // ---------------- 登录注册系统 ----------------
        const authModal = document.getElementById('auth-modal');
        const authTitle = document.getElementById('auth-title');
        const authSubmit = document.getElementById('auth-submit');
        const authToggle = document.getElementById('auth-toggle');
        const authError = document.getElementById('auth-error');
        const avatarBtn = document.getElementById('avatar-btn');
        const dropdownMenu = document.getElementById('dropdown-menu');
        const defaultAvatarIcon = document.getElementById('default-avatar-icon');
        const userAvatarImg = document.getElementById('user-avatar-img');

        avatarBtn.onclick = (e) => {
            e.stopPropagation();
            if(!currentUser) {
                showAuthModal();
            } else {
                dropdownMenu.classList.toggle('active');
            }
        };

        document.addEventListener('click', () => {
            dropdownMenu.classList.remove('active');
        });
        dropdownMenu.onclick = (e) => e.stopPropagation();

        authToggle.onclick = () => {
            isLoginMode = !isLoginMode;
            authTitle.innerText = isLoginMode ? '登录' : '注册';
            authSubmit.innerText = isLoginMode ? '登录' : '注册';
            authToggle.innerText = isLoginMode ? '没有账号？点击注册' : '已有账号？点击登录';
            authError.style.display = 'none';
        };

        function showAuthModal() {
            authModal.style.display = 'flex';
            authTitle.innerText = '登录';
            authSubmit.innerText = '登录';
            authToggle.innerText = '没有账号？点击注册';
            isLoginMode = true;
            authError.style.display = 'none';
            document.getElementById('auth-username').value = '';
            document.getElementById('auth-password').value = '';
        }

        function validateInput(str) {
            const hasLower = /[a-z]/.test(str);
            const hasUpper = /[A-Z]/.test(str);
            const hasNumber = /[0-9]/.test(str);
            const hasInvalid = /[^a-zA-Z0-9_]/.test(str);
            return hasLower && hasUpper && hasNumber && !hasInvalid;
        }

        authSubmit.onclick = () => {
            const username = document.getElementById('auth-username').value.trim();
            const password = document.getElementById('auth-password').value.trim();
            authError.style.display = 'block';

            if (!validateInput(username)) {
                authError.innerText = '账号必须包含大小写字母和数字，且不能有下划线以外的特殊符号';
                return;
            }
            if (!validateInput(password)) {
                authError.innerText = '密码必须包含大小写字母和数字，且不能有下划线以外的特殊符号';
                return;
            }

            if (isLoginMode) {
                const savedUser = JSON.parse(localStorage.getItem(`ishadow_account_${username}`));
                if (savedUser && savedUser.password === password) {
                    currentUser = { username };
                    localStorage.setItem('ishadow_user', JSON.stringify(currentUser));
                    authModal.style.display = 'none';
                    updateUserUI();
                } else {
                    authError.innerText = '账号或密码错误';
                }
            } else {
                if (localStorage.getItem(`ishadow_account_${username}`)) {
                    authError.innerText = '该账号已存在';
                    return;
                }
                localStorage.setItem(`ishadow_account_${username}`, JSON.stringify({ password }));
                currentUser = { username };
                localStorage.setItem('ishadow_user', JSON.stringify(currentUser));
                authModal.style.display = 'none';
                updateUserUI();
            }
        };

        // 更新头像UI
        function updateUserUI() {
            if (currentUser) {
                const savedAvatar = localStorage.getItem(`ishadow_avatar_${currentUser.username}`);
                if (savedAvatar) {
                    defaultAvatarIcon.style.display = 'none';
                    userAvatarImg.style.display = 'block';
                    userAvatarImg.src = savedAvatar;
                } else {
                    defaultAvatarIcon.style.display = 'block';
                    userAvatarImg.style.display = 'none';
                }
                document.getElementById('menu-my-name').innerText = `名字: ${currentUser.username}`;
            } else {
                defaultAvatarIcon.style.display = 'block';
                userAvatarImg.style.display = 'none';
            }
        }
        updateUserUI();

        // 菜单功能
        document.getElementById('menu-my-avatar').onclick = () => {
            document.getElementById('avatar-upload').click();
        };

        document.getElementById('avatar-upload').onchange = (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    const base64Img = event.target.result;
                    localStorage.setItem(`ishadow_avatar_${currentUser.username}`, base64Img);
                    updateUserUI();
                };
                reader.readAsDataURL(file);
            }
        };

        document.getElementById('menu-warehouse').onclick = () => {
            document.getElementById('main-page').style.display = 'none';
            document.getElementById('warehouse-page').style.display = 'block';
            dropdownMenu.classList.remove('active');
            
            const warehouseWaterfall = document.getElementById('warehouse-waterfall');
            let warehouse = JSON.parse(localStorage.getItem(`ishadow_wh_${currentUser.username}`)) || [];
            renderCards(warehouse, warehouseWaterfall);
        };

        document.getElementById('menu-logout').onclick = () => {
            currentUser = null;
            localStorage.removeItem('ishadow_user');
            updateUserUI();
            dropdownMenu.classList.remove('active');
        };

        document.getElementById('lang-select').onchange = (e) => {
            const lang = e.target.value;
            const name = currentUser ? currentUser.username : '';
            const langs = {
                'zh-CN': { myAvatar: '我的头像', myName: `名字: ${name}`, warehouse: '我的仓库', logout: '退出登录' },
                'en-US': { myAvatar: 'My Avatar', myName: `Name: ${name}`, warehouse: 'My Warehouse', logout: 'Log Out' },
                'ja-JP': { myAvatar: '私のアバター', myName: `名前: ${name}`, warehouse: '私の倉庫', logout: 'ログアウト' },
                'ko-KR': { myAvatar: '내 아바타', myName: `이름: ${name}`, warehouse: '내 창고', logout: '로그아웃' },
                'zh-HK': { myAvatar: '我的頭像', myName: `名字: ${name}`, warehouse: '我的倉庫', logout: '登出' }
            };
            const t = langs[lang];
            document.getElementById('menu-my-avatar').innerText = t.myAvatar;
            document.getElementById('menu-my-name').innerText = t.myName;
            document.getElementById('menu-warehouse').innerText = t.warehouse;
            document.getElementById('menu-logout').innerText = t.logout;
        };
    </script>
</body>
</html>
